name: 라벨

# 부서·버그 라벨을 만든다 (이미 있으면 색·설명만 맞춤). 라벨을 바꾸려면 아래 목록을 고친다.
on:
  push:
    branches: [main]
    paths: [.github/workflows/labels.yml]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-24.04
    steps:
      - name: 라벨 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create "기획" --force --color "1D76DB" --description "기획팀: 기획서, 규칙·수치, 그래픽 요청"
          gh label create "개발" --force --color "0E8A16" --description "개발팀: Godot 프로젝트, 게임플레이, 네트워크·스팀"
          gh label create "QA"   --force --color "FBCA04" --description "QA: 테스트, CI, 버그 찾기"
          gh label create "버그" --force --color "D73A4A" --description "버그"
